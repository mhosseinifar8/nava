[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nava-fa-speech"
version = "2.0.2"
description = "Official Python SDK and Client for Nava Persian Offline Speech Platform (Multi-Engine STT, TTS, G2P, Voice Cloning)"
readme = "README.md"
authors = [
    { name = "Mohammad Hosseinifar", email = "mhosseinifar8@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "persian",
    "farsi",
    "speech",
    "stt",
    "tts",
    "asr",
    "fastconformer",
    "shenava",
    "whisper",
    "piper",
    "kokoro",
    "voice-cloning",
    "ezafe",
    "itn",
    "sdk",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=13,<18",
    "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/mhosseinifar8/nava"
Repository = "https://github.com/mhosseinifar8/nava"
Documentation = "https://github.com/mhosseinifar8/nava#readme"
Issues = "https://github.com/mhosseinifar8/nava/issues"

[tool.hatch.build.targets.wheel]
packages = ["nava", "nava_fa_speech"]
