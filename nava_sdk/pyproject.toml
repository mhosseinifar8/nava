[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nava"
version = "2.0.0"
description = "Python SDK for Nava offline Persian speech services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=13,<18",
    "pydantic>=2.7.0",
]

[project.scripts]
nava-download = "nava.models.downloader:main"

[tool.hatch.build.targets.wheel]
packages = ["nava"]
