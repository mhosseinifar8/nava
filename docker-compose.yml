# Infrastructure is driven by environment variables — see .env.example.
# Safe defaults work on ANY machine: soft CPU quotas, no core pinning.
# Generate a tuned .env for this host with: ./scripts/configure_infra.sh auto
services:
  nava-stt:
    build:
      context: .
      dockerfile: ./nava-stt/Dockerfile
    image: ${NAVA_STT_IMAGE:-mhosseinifar8/nava-stt:latest}
    environment:
      NAVA_MODELS_DIR: /models
      NAVA_WHISPER_MODEL_DIR: /models/whisper-large-v3
      NAVA_WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      NAVA_STT_WORKERS: ${STT_WORKERS:-2}
      NAVA_STT_OMP_THREADS: ${STT_OMP_THREADS:-4}
      OMP_NUM_THREADS: ${STT_OMP_THREADS:-4}
      MKL_NUM_THREADS: ${STT_OMP_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${STT_OMP_THREADS:-4}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      all_proxy: ${ALL_PROXY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes: [./models:/models]
    ports: 
        - "8001:8001"
    cpus: "${STT_CPUS:-2.0}"
    cpuset: "${STT_CPUSET:-}"
    mem_limit: "${STT_MEM:-8g}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped
  nava-tts:
    build:
      context: .
      dockerfile: ./nava-tts/Dockerfile
    image: ${NAVA_TTS_IMAGE:-mhosseinifar8/nava-tts:latest}
    environment:
      NAVA_MODELS_DIR: /models
      NAVA_TTS_WORKERS: ${TTS_WORKERS:-2}
      NAVA_TTS_OMP_THREADS: ${TTS_OMP_THREADS:-4}
      OMP_NUM_THREADS: ${TTS_OMP_THREADS:-4}
      MKL_NUM_THREADS: ${TTS_OMP_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${TTS_OMP_THREADS:-4}
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      all_proxy: ${ALL_PROXY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes: [./models:/models]
    ports:
        - "8002:8002"
    cpus: "${TTS_CPUS:-2.0}"
    cpuset: "${TTS_CPUSET:-}"
    mem_limit: "${TTS_MEM:-8g}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    restart: unless-stopped
  nava-server:
    build: .
    image: ${NAVA_SERVER_IMAGE:-mhosseinifar8/nava:latest}
    environment:
      NAVA_MODELS_DIR: /models
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      all_proxy: ${ALL_PROXY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes: [./models:/models]
    ports:
      - "8000:8000"
    cpus: "${SERVER_CPUS:-2.0}"
    mem_limit: "${SERVER_MEM:-8g}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    profiles: ["all", "unified"]
