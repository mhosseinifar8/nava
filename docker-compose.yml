services:
  nava-stt:
    build: ./nava-stt
    image: nava/stt:local
    environment:
      NAVA_WHISPER_MODEL_DIR: /models/whisper-large-v3
      NAVA_WHISPER_COMPUTE_TYPE: ${NAVA_WHISPER_COMPUTE_TYPE:-float32}
      NAVA_INFERENCE_WORKERS: ${NAVA_STT_WORKERS:-2}
      OMP_NUM_THREADS: ${NAVA_STT_OMP_THREADS:-4}
      MKL_NUM_THREADS: ${NAVA_STT_OMP_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${NAVA_STT_OMP_THREADS:-4}
    volumes: [./models:/models:ro]
    ports: ["127.0.0.1:8001:8001"]
    cpuset: "0-3"
    restart: unless-stopped
    networks: [nava]
  nava-tts:
    build: ./nava-tts
    image: nava/tts:local
    environment:
      NAVA_MODELS_DIR: /models
      NAVA_INFERENCE_WORKERS: ${NAVA_TTS_WORKERS:-2}
      OMP_NUM_THREADS: ${NAVA_TTS_OMP_THREADS:-4}
      MKL_NUM_THREADS: ${NAVA_TTS_OMP_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${NAVA_TTS_OMP_THREADS:-4}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes: [./models:/models:ro]
    ports: ["127.0.0.1:8002:8002"]
    cpuset: "4-7"
    restart: unless-stopped
    networks: [nava]
networks:
  nava:
    driver: bridge
    internal: true
