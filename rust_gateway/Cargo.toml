[package]
name = "nava-gateway"
version = "0.1.0"
edition = "2021"
authors = ["Mohammad Hosseinifar <mhosseinifar8@gmail.com>"]
description = "Ultra-Low-Latency Rust Fast-Path Gateway for Nava Persian Speech Pipeline"

[lib]
name = "nava_core_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
lazy_static = "1.4"
tower-http = { version = "0.5", features = ["cors"] }

